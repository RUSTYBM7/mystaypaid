<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStayPaid — Coming Soon</title>
  <meta name="theme-color" content="#DC2626">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F5F5F7;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 48px rgba(0,0,0,0.1);
    }
    .icon {
      width: 72px; height: 72px;
      background: #DC2626;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 8px 24px rgba(220,38,38,0.3);
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.6px;
      color: #000;
      margin-bottom: 8px;
    }
    p {
      font-size: 16px;
      color: rgba(60,60,67,0.6);
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 28px;
      background: #DC2626;
      color: #fff;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(220,38,38,0.25);
      transition: all 0.2s;
    }
    .btn:hover { background: #B91C1C; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>
    <h1>MyStayPaid</h1>
    <p>Your new project is under construction. Something great is coming soon.</p>
    <a href="mailto:hello@mystaypaid.com" class="btn">Get Notified</a>
  </div>
</body>
</html>
